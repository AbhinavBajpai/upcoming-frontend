name: Frontend checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: upcoming_test
          POSTGRES_USER: upcoming
          POSTGRES_PASSWORD: upcoming_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U upcoming -d upcoming_test"
          --health-interval 2s --health-timeout 3s --health-retries 20
      mailpit:
        image: axllent/mailpit:v1.31.1
        ports: ["1025:1025", "8025:8025"]
    env:
      DATABASE_URL: postgres://upcoming:upcoming_ci@localhost:5432/upcoming_test
      E2E_BACKEND_PATH: .e2e-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.1
          cache: npm
      - run: npm ci
      - run: npm run check
      - uses: actions/checkout@v4
        with:
          repository: AbhinavBajpai/upcoming-backend
          # Pin the backend contract exercised by these browser tests.
          ref: d2531f4c8b9bb6342c42b4466eea0562780c47a3
          path: .e2e-backend
      - run: npm ci && npm run build
        working-directory: .e2e-backend
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calendar-browser-results
          path: test-results/
          retention-days: 7
